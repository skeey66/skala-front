<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>나의 휴일 일과</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="page-desktop">
        <div class="container">
            <div class="window pixel-corner holiday-window">
                <div class="titlebar">
                    <span class="name">🌴 휴일 일과</span>
                    <span class="controls"><span class="ctl">_</span><span class="ctl">▢</span><span class="ctl">×</span></span>
                </div>
                <div class="win-body">
                    <h1>🤗나의 휴일 일과</h1>
                    <br>
                    <hr>

                    <div class="holiday-page">
                        <section class="holiday-block">
                            <h2><u>🛌 아침</u></h2>
                            <p class="holiday-row"><b>09:00</b> 💻 코딩테스트 <mark>3문제</mark> 풀이</p>
                            <p class="holiday-row"><b>10:00</b> ☕️ 여유 있게 <mark>커피 한잔</mark> 즐기기</p>
                            <p class="holiday-row"><b>11:00</b> 📕 부족한 부분 <mark>인강</mark> 듣기</p>
                        </section>

                        <section class="holiday-block">
                            <h2><u>☀️ 점심</u></h2>
                            <p class="holiday-row"><b>13:00</b> 🏃 운동 하면서 <mark>마음 정리</mark></p>
                            <p class="holiday-row"><b>14:30</b> 🎶 음악 들으면서 <mark>좋은 노래 찾기</mark></p>
                            <p class="holiday-row"><b>16:00</b> 🖥️ <mark>기술 트렌드</mark> 파악</p>
                        </section>

                        <section class="holiday-block">
                            <h2><u>🌕 저녁</u></h2>
                            <p class="holiday-row"><b>18:00</b> 🍜 <mark>맛있는 저녁</mark> 만들기</p>
                            <p class="holiday-row"><b>20:00</b> 📺 <mark>OTT</mark> 감상</p>
                            <p class="holiday-row"><b>23:00</b> 🧘 하루 동안 배운거 정리하면서 <mark>취침</mark></p>
                        </section>

                        <p class="holiday-footer">휴일 버전 작성일: 2026년 7월</p>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>
