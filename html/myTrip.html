<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 사진 앨범</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-desktop">
    <div class="container trip-wide">
        <div class="window pixel-corner trip-window">
            <div class="titlebar">
                <span class="name">🖼 사진 앨범</span>
                <span class="controls"><span class="ctl">_</span><span class="ctl">▢</span><span class="ctl">×</span></span>
            </div>
            <div class="win-body">
                <h2>🎵 BGM </h2>
                <audio controls>
                <source src="../media/music.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <hr>

            <h2>🌄 여행 사진</h2>
            <div class="album-page">
                <div class="trip-grid-container travel-grid">
                    <div class="trip-label trip-label-taiwan">🇹🇼 대만</div>
                    <div class="trip-label trip-label-korea">🇰🇷 국내 여행</div>
                    <p class="trip-card">
                        <img src="../media/타이페이101.jpeg" width="400" height="600" alt="타이페이101"><br>타이페이101 (2025년)
                    </p>
                    <p class="trip-card">
                        <img src="../media/부산.jpeg" width="400" height="300" alt="부산"><br>부산 (2023년)
                    </p>
                    <p class="trip-card">
                        <img src="../media/여수.jpeg" width="400" height="400" alt="여수"><br>여수 (2024년)
                    </p>
                </div>
            </div>

            <h2>🍽 여행 중 먹었던 음식</h2>
            <div class="album-page">
                <div class="trip-grid-container food-grid">
                    <p class="trip-card">
                        <img src="../media/duck.jpeg" width="400" height="300" alt="오리 구이"><br>베이징 덕 🦆
                    </p>
                    <p class="trip-card">
                        <img src="../media/fish.jpeg" width="400" height="300" alt="모둠 회"><br>모둠 회 🐟
                    </p>
                    <p class="trip-card">
                        <img src="../media/octo.jpeg" width="400" height="300" alt="문어 요리"><br>문어 요리 🐙
                    </p>
                    <p class="trip-card">
                        <img src="../media/pasta.jpeg" width="400" height="300" alt="바질 파스타"><br>바질 파스타 🍝
                    </p>
                    <p class="trip-card">
                        <img src="../media/steak.jpeg" width="400" height="533" alt="스테이크 플래터"><br>양고기 플래터 🥩
                    </p>
                    <p class="trip-card">
                        <img src="../media/sushi.jpeg" width="400" height="300" alt="연어회와 굴"><br>연어 초밥과 오징어 초밥 🍣
                    </p>
                    <p class="trip-card">
                        <img src="../media/viking.jpeg" width="400" height="300" alt="바이킹 뷔페"><br>바이킹 뷔페 🍽️
                    </p>
                </div>
            </div>

            <hr>
            <h2>📹 나의 여행 브이로그</h2>
            <p>
                <video width="300" height="533" controls>
                    <source src="../media/tea.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <br>
                🍵 티타임
            </p>
            </div>
        </div>
    </div>
</body>
</html>
